openapi: 3.1.0
info:
  title: Field Shift API
  version: 0.15.0
  description: |
    Contract between the frontend and backend of the Field Shift farmer map
    (NASA Space Apps, crop-rotation decision support). THIS FILE IS THE SOURCE OF TRUTH.
    Change it first (PR + entry in CONTRACT_CHANGELOG.md), then change code.

    ## Conventions (apply everywhere)
    - Base path `/v1`. JSON, UTF-8. Timestamps are ISO 8601 UTC (`2026-11-14T12:00:00Z`). Dates are `YYYY-MM-DD`.
    - Coordinates in our own objects are `{ "lat": number, "lon": number }` (WGS84). NEVER bare arrays.
      The only exception is GeoJSON and bbox, which follow the GeoJSON spec: `[lon, lat]` and `[west, south, east, north]`.
    - All numeric values are SI (m, mm, degC, m3/m3, g/kg, ha). The frontend converts to US units for display.
    - A metric that cannot be provided is returned with `value: null` and `quality: unavailable` plus a reason. Never omit it and never invent it.
    - Every metric states its `source` and `resolution_m`, because satellite data is often much coarser than a field.
    - Errors always use the `ErrorResponse` envelope. Every response carries an `X-Request-Id` header.
    - Coverage: contiguous US (CONUS). Field polygons exist only in the supported states listed by
      `GET /meta/coverage` (v0.3: Iowa, Illinois, Nebraska). Elsewhere in CONUS a point resolves to a
      buffered point (a circle around it). ML analysis covers IA/IL/NE/KS and requires crop history
      outside its precomputed fields; unavailable coverage or inputs are reported as failed jobs.
    - The selectable unit is an **estimated field area** from USDA NASS Crop Sequence Boundaries (CSB).
      CSB polygons are an algorithmic estimate, not a legal or ownership boundary: a real field may be
      split into several polygons or merged with a neighbour. The UI must say "estimated field area".
    - Field polygons are NEVER sent as bulk GeoJSON. They are drawn from one PMTiles file read with HTTP
      Range requests; its URL is `coverage.field_tiles.url_template`. By default the backend serves it at
      `GET /tiles/fields.pmtiles`; a deployment may point the URL at external static hosting instead.
servers:
- url: http://localhost:8000/v1
  description: Local backend
tags:
- name: meta
- name: geo
- name: tiles
- name: fields
- name: snapshots
- name: analyses
- name: profitability
- name: auth
- name: saved-fields
  description: A signed-in farmer's own saved fields. Every route needs a bearer token.
- name: comparisons
  description: Compare saved fields side by side and rank the fields of an area. Every route needs a bearer token.
paths:
  /health:
    get:
      tags:
      - meta
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
  /meta/coverage:
    get:
      tags:
      - meta
      operationId: getCoverage
      summary: Where the app works and where field polygons are available
      description: Frontend uses this to set map bounds, tile zoom thresholds and to warn users outside field coverage.
      responses:
        '200':
          description: Coverage description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
  /geo/states:
    get:
      tags:
      - geo
      operationId: listStates
      summary: List the supported states (for the state/county picker)
      description: Only states with field polygons (v0.3 IA, IL, NE). Other CONUS states are not listed.
      responses:
        '200':
          description: Supported states, sorted by name
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/State'
  /geo/states/{state_fips}/counties:
    get:
      tags:
      - geo
      operationId: listCounties
      summary: List counties of a supported state
      description: '`404 NOT_FOUND` for a state that is not in `GET /geo/states`.'
      parameters:
      - name: state_fips
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StateFips'
      responses:
        '200':
          description: Counties, sorted by name
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/County'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /geo/counties/{county_fips}:
    get:
      tags:
      - geo
      operationId: getCounty
      summary: One county (use its bbox to fit the map after the user picks it)
      parameters:
      - name: county_fips
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CountyFips'
      responses:
        '200':
          description: County
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/County'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /locations/resolve:
    post:
      tags:
      - geo
      operationId: resolveLocation
      summary: Turn pasted text into a field selection (entry methods 2 and 3)
      description: |
        The user pastes ONE string into one input. Backend detects the kind:
        plain coordinates (`41.5868, -93.625`, also `41.5868 -93.625` and degrees/minutes/seconds),
        a Google Maps URL (full or short link), or an Apple Maps URL (full or short link).
        Short links are followed server-side (host allow-list, no other redirects).
        The point is then resolved to a field (see `POST /fields/resolve`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  type: string
                  minLength: 3
                  maxLength: 2048
            examples:
              plain:
                value:
                  input: 41.5868, -93.6250
              google:
                value:
                  input: https://maps.app.goo.gl/AbCdEf123
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedLocation'
        '422':
          description: |
            Error codes: `UNPARSEABLE_INPUT` (not coordinates or a known link),
            `UNSUPPORTED_LINK` (recognised link but no coordinates inside, typical for some Apple short links),
            `OUTSIDE_COVERAGE` (valid point outside CONUS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /fields/resolve:
    post:
      tags:
      - fields
      operationId: resolveField
      summary: Resolve a point (map click, coordinates) to a field selection
      description: |
        Snaps to the nearest field polygon within `snap_radius_m`. If none is found, falls back to a buffered point
        (`resolved_by = buffered_point`) so the user can still run an analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - point
              properties:
                point:
                  $ref: '#/components/schemas/LatLon'
                snap_radius_m:
                  type: number
                  minimum: 0
                  maximum: 2000
                  default: 300
                source:
                  $ref: '#/components/schemas/SelectionSource'
      responses:
        '200':
          description: Selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSelection'
        '422':
          description: '`OUTSIDE_COVERAGE` or `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /fields/info:
    post:
      tags:
      - fields
      operationId: getFieldInfo
      summary: Farmer-facing context for a selected map point
      description: |
        Accepts the same WGS84 point as `/fields/resolve`; pass `FieldSelection.anchor`
        after selecting a field. Independent of snapshots and ML analyses.
        Coverage is limited to rough state bounding boxes for Iowa, Illinois and Nebraska.
        Samples and in-memory cache keys round coordinates to four decimal places (~11 m).
        Sources run concurrently with a short per-source deadline. Missing values remain
        null with `quality: unavailable` and `unavailable_reason`; even a total upstream
        outage returns 200. Successful source results are cached for 24 hours. Slow sources
        continue in the background for up to 60 seconds and populate the cache for later requests;
        repeated requests for the same source and point share the pending fetch.
        Each recent climate metric covers its latest complete 12-month window, which may
        differ between parameters due to publishing lag. Precipitation is a 12-month total;
        temperature and solar radiation are day-weighted means. Long-term values use the
        NASA-provided climatology baseline. NLCD uses the fixed 2024 annual product.
        Authentication is not yet merged; the route has an explicit dependency hook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [point]
              additionalProperties: false
              properties:
                point:
                  $ref: '#/components/schemas/LatLon'
            example:
              point: {lat: 41.98, lon: -93.7}
      responses:
        '200':
          description: Available context, including null metrics for unavailable data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldInfo'
        '422':
          description: '`OUTSIDE_COVERAGE` (IA/IL/NE only) or `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /fields/{field_id}:
    get:
      tags:
      - fields
      operationId: getField
      summary: Get a field by id (landing-page click on a field tile)
      parameters:
      - name: field_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/FieldId'
      responses:
        '200':
          description: Selection for that field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSelection'
        '404':
          $ref: '#/components/responses/NotFound'
  /tiles/fields.pmtiles:
    get:
      tags:
      - tiles
      operationId: getFieldsPmtiles
      summary: The field polygon PMTiles archive (read with HTTP Range requests)
      description: |
        The whole PMTiles v3 archive described by `coverage.field_tiles` (source layer `fields`). Clients
        read it with the PMTiles library, which sends `Range: bytes=a-b` requests and uses `ETag` to notice
        a rebuilt file. Do not hardcode this path: use `coverage.field_tiles.url_template`, which may point
        elsewhere. `HEAD` is supported with the same headers. CORS exposes `ETag`, `Content-Range` and
        `Content-Length`.
      parameters:
      - name: Range
        in: header
        required: false
        schema:
          type: string
          example: bytes=0-16383
      responses:
        '200':
          description: Whole file (no `Range` header)
          headers:
            ETag:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                enum:
                - bytes
          content:
            application/vnd.pmtiles:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes 0-16383/539948783
            ETag:
              schema:
                type: string
          content:
            application/vnd.pmtiles:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Range not satisfiable
  /tiles/boundaries/{z}/{x}/{y}.mvt:
    get:
      tags:
      - tiles
      operationId: getBoundaryTile
      summary: State and county outlines (vector tile)
      description: |
        Mapbox Vector Tile, all of CONUS. Layers: `states` (props: `fips`, `name`, `postal`),
        `counties` (props: `fips`, `name`, `state_fips`).
        Suggested use: `states` at zoom < 7, `counties` at zoom 7 to 10, then the field polygons from the
        PMTiles file in `coverage.field_tiles` from `coverage.field_tiles.min_zoom`.
        Field polygons are not XYZ tiles: see `GET /tiles/fields.pmtiles`.
      parameters:
      - $ref: '#/components/parameters/Z'
      - $ref: '#/components/parameters/X'
      - $ref: '#/components/parameters/Y'
      responses:
        '200':
          $ref: '#/components/responses/VectorTile'
        '204':
          description: Empty tile
        '422':
          $ref: '#/components/responses/ValidationError'
  /tiles/plss/{z}/{x}/{y}.mvt:
    get:
      tags:
      - tiles
      operationId: getPlssTile
      summary: Survey townships and sections in the field states (vector tile)
      description: |
        Mapbox Vector Tile of the Public Land Survey System (BLM National PLSS CadNSDI) in the supported
        states, zoom 7 to 12 (clients overzoom past 12). A survey township is about 6 x 6 miles; it has
        36 sections of 1 square mile. Layers:
        `townships` (polygons; props: `plssid`, `label` like `T84N R23W`, `name` like `Grant Twp` or
        empty when the area has no civil township, `w`, `s`, `e`, `n` bbox of the whole township),
        `township_labels` (points; props: `plssid`, `label`, `name`, `county_fips`),
        `sections` from zoom 11 (polygons, no props),
        `section_labels` from zoom 11 (points; props: `n` section number 1 to 36, `county_fips`).
        Suggested use: townships between the county and field scales, sections with the fields.
        `204` when the tile is empty or the server has no PLSS data.
      parameters:
      - $ref: '#/components/parameters/Z'
      - $ref: '#/components/parameters/X'
      - $ref: '#/components/parameters/Y'
      responses:
        '200':
          $ref: '#/components/responses/VectorTile'
        '204':
          description: Empty tile
        '422':
          $ref: '#/components/responses/ValidationError'
  /snapshots:
    post:
      tags:
      - snapshots
      operationId: createSnapshot
      summary: Base data for a selected field (fast, cached)
      description: |
        Called as soon as a field is selected (landing click, or any of the 3 entry methods).
        Target latency under 2 s; the backend caches by field_id or rounded point. Synchronous.
        Metrics are the same shape the analysis uses, so the UI can reuse one component.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - selection
              properties:
                selection:
                  $ref: '#/components/schemas/SelectionRef'
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`OUTSIDE_COVERAGE` or `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analyses:
    post:
      tags:
      - analyses
      operationId: createAnalysis
      summary: Start a rotation analysis (async job)
      description: |
        Triggered by "Get analysis". Returns 202 immediately with a job. Poll `GET /analyses/{job_id}`
        every 2 s (back off to 5 s after 30 s). Identical requests within the cache window may return an existing job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      security:
      - {}
      - bearerAuth: []
      responses:
        '202':
          description: Job accepted
          headers:
            Location:
              schema:
                type: string
              description: URL of the job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`OUTSIDE_COVERAGE` or `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /analyses/{job_id}:
    get:
      tags:
      - analyses
      operationId: getAnalysis
      summary: Job status and, when finished, the result
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - {}
      - bearerAuth: []
      responses:
        '200':
          description: |
            Job state. `result` is present only when `status = succeeded`; `error` only when `status = failed`.
            A failed JOB still returns HTTP 200; HTTP errors are for failed REQUESTS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /analyses/{job_id}/report.pdf:
    get:
      tags:
      - analyses
      operationId: getAnalysisReport
      summary: The finished analysis as a printable PDF report
      description: |
        "Export to PDF" on the Analysis page. An A4 portrait report rendered by the backend from the same
        `AnalysisResult` as `GET /analyses/{job_id}`, plus the priorities and horizon of the request: a summary
        page, one card per strategy (sorted by score), current conditions and history charts, then the datasets
        and the disclaimer. Values in US units; a missing metric prints "Not available" with its reason.
        Sent as an attachment. Available only once the job has `status = succeeded`; the same job always gives the
        same report. Guest links are bearer links. Jobs created while signed in require the same account;
        other callers receive 404. Invalid supplied bearer tokens receive 401.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - {}
      - bearerAuth: []
      responses:
        '200':
          description: The PDF report.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: '`attachment; filename="seloai-analysis-<county>-<state>-<job id prefix>.pdf"`'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ANALYSIS_NOT_READY`: the job is still queued or running, or it failed. `details.status`
            holds the job status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /profitability/estimate:
    post:
      tags:
      - profitability
      operationId: estimateProfitability
      summary: Rough profit per acre for one crop (low / base / high)
      description: 'Synchronous USD enterprise budget: yield times sale price minus costs. Requires sign-in.
        Defaults use sourced historical prices and published cost/yield pairs. Farmer prices, yield, itemized
        costs, total cost and area can replace defaults. Zero yield and price are valid. Unsourced placeholders
        produce status unavailable with missing_inputs and null scenarios. Includes sources, break-even price/yield
        and field totals. Economic return includes published ownership/labor allowances; it is not cash flow.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfitEstimateRequest'
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitEstimate'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - bearerAuth: []
  /profitability/rotation:
    post:
      tags:
      - profitability
      operationId: estimateRotationBudget
      summary: Budget a crop rotation without running ML
      description: Uses the same calculator as analysis and field comparisons. Charges land once per year. Unknown
        crop, cover, land or double-crop inputs withhold full totals. Farmer crop budgets supply gross revenue
        and non-land production costs. No external calls, discounting or inflation.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationBudgetRequest'
      responses:
        '200':
          description: Rotation budget, including partial or unavailable results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationBudget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /profitability/baselines:
    get:
      tags:
      - profitability
      operationId: getProfitabilityBaselines
      summary: Default estimates and data coverage for every baseline crop and state
      description: Nine default estimates, each with provenance and missing inputs. No farmer data, external
        calls or forecasts.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfitEstimate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register:
    post:
      tags:
      - auth
      operationId: register
      summary: Create an account and sign in
      description: |
        Email is trimmed and stored lowercase. Password: 8-128 characters, at least one letter and one digit.
        On success the response sets the refresh token cookie (see `/auth/refresh`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '409':
          description: '`EMAIL_TAKEN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags:
      - auth
      operationId: login
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshTokens
      summary: New access token from the refresh token cookie
      description: |
        Reads the `refresh_token` httpOnly cookie (path `/v1/auth`); call with `credentials: "include"`.
        The refresh token is single use: it is rotated and the response sets a new cookie.
      responses:
        '200':
          description: New access token and rotated refresh cookie
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: Revoke the refresh token and clear its cookie
      description: Idempotent. Access tokens already issued stay valid until they expire.
      responses:
        '204':
          description: Signed out
  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the signed-in user's password
      description: |
        Requires the current password. On success, all access tokens, refresh tokens and reset links
        for this user are revoked, including this session. Clear the local session and sign in again.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; refresh cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password reset email
      description: |
        Returns the same empty 202 for known and unknown email addresses. Delivery runs after the
        response through Brevo SMTP. Reset links expire after one hour and are single use. At most
        one email per account per minute. A new link invalidates the previous link. The response never
        contains a token. 502 means SMTP is not configured, regardless of whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted; check email if the account exists
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: '`UPSTREAM_DATA_UNAVAILABLE`. Password reset email is not configured.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password using an emailed reset token
      description: |
        A missing, invalid, expired or used token is 422 VALIDATION_ERROR. On success all access tokens,
        refresh tokens and reset links for the account are revoked; sign in again with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset; refresh cookie cleared
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      tags:
      - auth
      operationId: getMe
      summary: The signed-in user
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/fields:
    get:
      tags:
      - saved-fields
      operationId: listSavedFields
      summary: The signed-in user's saved fields, newest first
      description: Each item carries its stored context snapshot (`info`), so no external calls are made.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Saved fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFieldList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - saved-fields
      operationId: createSavedField
      summary: Save a field selected on the map
      description: |
        Send `FieldSelection.geometry` (a Polygon) and `FieldSelection.field_id`, or a GeoJSON Point.
        The backend derives `centroid` (inside the polygon), `area_ha` (EPSG:5070, null for points) and
        `state`. Every position must lie in Iowa, Illinois or Nebraska (rough state envelopes, as in
        `/fields/info`). Polygon rules: each ring closed and at least 4 positions, at most 20 rings and
        2000 positions, valid (no self-intersection), area above 0 and at most 2000 ha.
        The `/fields/info` context for the centroid is fetched once on create (same per-source deadline).
        `info` is null when every source is unavailable; call `refresh-info` later.
        At most `SavedFieldList.limit` (default 50) fields per user, else `409 FIELD_LIMIT_REACHED`.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFieldCreate'
            example:
              name: North 80
              field_id: csb2025_1900001
              geometry:
                type: Polygon
                coordinates: [[[-93.70, 41.98], [-93.69, 41.98], [-93.69, 41.99], [-93.70, 41.99], [-93.70, 41.98]]]
              crop_history:
              - {year: 2025, crop: Corn}
              - {year: 2024, crop: Soybeans}
      responses:
        '201':
          description: Saved
          headers:
            Location:
              description: '`/v1/me/fields/{id}`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedField'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`FIELD_LIMIT_REACHED`. `details.limit` is the per-user cap.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR` (bad name, geometry or crop history) or `OUTSIDE_COVERAGE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/fields/{saved_field_id}:
    parameters:
    - name: saved_field_id
      in: path
      required: true
      description: Saved field id (UUID). Another user's id, or a malformed one, is `404`.
      schema:
        type: string
    get:
      tags:
      - saved-fields
      operationId: getSavedField
      summary: One of the signed-in user's saved fields
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Saved field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedField'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - saved-fields
      operationId: updateSavedField
      summary: Rename a saved field or change its crop history
      description: Omitted keys stay as they are. `crop_history` null clears it. `name` cannot be null.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFieldUpdate'
            example:
              name: Home quarter
      responses:
        '200':
          description: Updated saved field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedField'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - saved-fields
      operationId: deleteSavedField
      summary: Delete a saved field (permanent)
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/fields/{saved_field_id}/refresh-info:
    parameters:
    - name: saved_field_id
      in: path
      required: true
      description: Saved field id (UUID). Another user's id, or a malformed one, is `404`.
      schema:
        type: string
    post:
      tags:
      - saved-fields
      operationId: refreshSavedFieldInfo
      summary: Fetch the field context again and store it
      description: |
        Same data as `/fields/info` for the saved centroid. When every source is unavailable the old
        snapshot is kept and the response is `502 UPSTREAM_DATA_UNAVAILABLE`.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Saved field with the new snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedField'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: '`UPSTREAM_DATA_UNAVAILABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /comparisons/saved-fields:
    post:
      tags:
      - comparisons
      operationId: compareSavedFields
      summary: Compare 2 to 4 of the signed-in user's saved fields side by side
      description: |
        Built for a farmer choosing which field to rent. One response holds everything the compare view
        needs: one column per field (`fields`, labelled A to D in request order) and ready-ranked rows
        (`rows`), so the frontend does not compute winners itself.

        Data per field:
        - Soil (`soil_*` rows) from the field snapshot, the same data as `POST /snapshots` for the saved
          field's CSB id (area-weighted over the estimated field area) or, without one, its centroid.
          Includes `soil_productivity_nccpi` (USDA NCCPI, 0-100).
        - Slope, land cover, drainage and long-term climate from the saved `/fields/info` context. A field
          saved without it is fetched live once (not stored).
        - Money from an illustrative rotation budget (same rules as `Strategy.budget`) for one shared crop
          plan (`plan`), charged at the farmer's asking rent (`rent_per_acre`) or the state reference rent.
          The plan starts with the crop that follows each field's latest crop, so the soybean nitrogen credit
          lands where it should. Yields and prices are state references: between fields in one state, money
          differs only by rent, previous crop and size. Soil quality is never turned into yield.

        A source that fails gives `unavailable` cells and a caution; the request still answers 200.
        Rate limited per client (`429 RATE_LIMITED`).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFieldComparisonRequest'
            example:
              saved_field_ids: [3f0c2c55-8d64-4f5e-9a51-2d8f8f6f1b10, 9b1e7a40-5c3d-4b7e-8f2a-1c6d5e4f3a21]
              rent_per_acre: {3f0c2c55-8d64-4f5e-9a51-2d8f8f6f1b10: 265}
              plan: {rotation: [corn, soybean], horizon_years: 2}
              home: {lat: 41.98, lon: -93.62}
      responses:
        '200':
          description: The comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldComparison'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`NOT_FOUND`: a saved field id that is not the user''s (`details.saved_field_id`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /comparisons/area:
    post:
      tags:
      - comparisons
      operationId: rankAreaFields
      summary: Rank every estimated field in a county, a box or a township outline
      description: |
        For screening many fields before a detailed comparison: filter, sort and page all CSB fields of an
        area, with each field's percentile among the matching fields (where it stands in its county).

        `area` is one of `{county_fips}` (a field-state county), `{bbox}` or `{polygon}` (for a survey
        township, send the outline drawn on the map). A box or outline spans at most 1 degree each way.
        A field belongs to the area when a point inside it does. At most 30,000 fields per area
        (`AREA_MAX_FIELDS`), else `422` with `details.max_fields`.

        Soil (`productivity`, `soil_name`, `drainage`) is SSURGO at one point inside each field: a
        screening value. Ratings are stored once looked up. Fields without one are looked up in the
        background: `soil.status` is `filling` meanwhile; ask again (same body) every few seconds until it
        is `complete`. `partial` / `unavailable` mean the lookup failed; it is retried after about 2
        minutes. Unrated fields sort last by productivity and fail `min_productivity`.
        Rate limited per client (`429 RATE_LIMITED`).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaRankingRequest'
            example:
              area: {county_fips: '19169'}
              filters: {min_area_ha: 20, exclude_continuous_corn: true}
              sort: productivity
              pinned_field_ids: [csb2025_191825003871492]
              limit: 25
      responses:
        '200':
          description: One page of ranked fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaRanking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`NOT_FOUND`: unknown county.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR` (bad body, area too large, too many fields) or `OUTSIDE_COVERAGE`
            (county outside Iowa, Illinois, Nebraska).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: '`INTERNAL_ERROR`: the field database is not reachable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/auth/login`, `/auth/register` or `/auth/refresh`.
  headers:
    RefreshCookie:
      description: '`refresh_token=<opaque>; HttpOnly; Path=/v1/auth; Max-Age=<refresh TTL>; SameSite=...`'
      schema:
        type: string
  parameters:
    Z:
      name: z
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 22
    X:
      name: x
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    Y:
      name: y
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
  responses:
    Unauthorized:
      description: |
        `UNAUTHORIZED`. `details.reason` is one of `missing_token`, `token_expired`, `invalid_token`,
        `unknown_user`, `invalid_credentials`, `missing_refresh_token`, `invalid_refresh_token`,
        `session_revoked`.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: '`VALIDATION_ERROR`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VectorTile:
      description: Mapbox Vector Tile
      content:
        application/vnd.mapbox-vector-tile:
          schema:
            type: string
            format: binary
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: '`RATE_LIMITED`. Honour the `Retry-After` header.'
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least one letter and one digit.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least one letter and one digit, as for registration.
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: Opaque token from the emailed link.
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least one letter and one digit, as for registration.
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Lowercase.
        created_at:
          type: string
          format: date-time
    AuthTokens:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
          description: 'JWT. Send as `Authorization: Bearer <access_token>`.'
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        user:
          $ref: '#/components/schemas/User'
    LatLon:
      type: object
      required:
      - lat
      - lon
      additionalProperties: false
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      example:
        lat: 41.5868
        lon: -93.625
    BBox:
      type: array
      description: '[west, south, east, north] in degrees, GeoJSON order.'
      minItems: 4
      maxItems: 4
      items:
        type: number
      example:
      - -96.64
      - 40.37
      - -90.14
      - 43.5
    GeoJSONPoint:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Point
        coordinates:
          type: array
          description: '[lon, lat]'
          minItems: 2
          maxItems: 2
          items:
            type: number
    GeoJSONPolygon:
      type: object
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Polygon
        coordinates:
          type: array
          description: Linear rings, each a list of [lon, lat]. First ring is the exterior.
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
    SavedCropYear:
      description: A farmer-entered crop for one year.
      type: object
      required: [year, crop]
      additionalProperties: false
      properties:
        year:
          type: integer
          minimum: 1990
          maximum: 2100
        crop:
          type: string
          minLength: 1
          maxLength: 64
    SavedFieldCreate:
      type: object
      required: [name, geometry]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; must not be blank.
        geometry:
          oneOf:
          - $ref: '#/components/schemas/GeoJSONPolygon'
          - $ref: '#/components/schemas/GeoJSONPoint'
        field_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: '`FieldSelection.field_id` when a mapped CSB field was picked; null otherwise.'
        crop_history:
          type: [array, 'null']
          maxItems: 10
          description: Last crops grown, newest first. Optional.
          items:
            $ref: '#/components/schemas/SavedCropYear'
    SavedFieldUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        crop_history:
          type: [array, 'null']
          maxItems: 10
          items:
            $ref: '#/components/schemas/SavedCropYear'
    SavedField:
      type: object
      required: [id, name, field_id, geometry, centroid, area_ha, state, crop_history, info, info_fetched_at,
        created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        field_id:
          type: [string, 'null']
        geometry:
          oneOf:
          - $ref: '#/components/schemas/GeoJSONPolygon'
          - $ref: '#/components/schemas/GeoJSONPoint'
        centroid:
          $ref: '#/components/schemas/LatLon'
          description: Inside the polygon (or the point itself). `/fields/info` is sampled here.
        area_ha:
          type: [number, 'null']
          description: Polygon area in hectares (EPSG:5070); null for a point.
        state:
          type: string
          enum: [IA, IL, NE]
        crop_history:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/SavedCropYear'
        info:
          description: Stored `/fields/info` snapshot; null until it could be fetched.
          oneOf:
          - $ref: '#/components/schemas/FieldInfo'
          - type: 'null'
        info_fetched_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedFieldList:
      type: object
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedField'
        limit:
          type: integer
          description: Maximum saved fields per user.
    StateFips:
      type: string
      pattern: ^[0-9]{2}$
      example: '19'
    CountyFips:
      type: string
      description: 5-digit state+county FIPS.
      pattern: ^[0-9]{5}$
      example: '19153'
    FieldId:
      type: string
      description: |
        Stable id of an estimated field area. Opaque to the frontend. Built as `csb<edition>_<source id>`:
        the CSB source id (`CSBID`) is unique only within one CSB edition, so the edition's last year is part
        of the id. It changes when the data version changes (see `Coverage.field_data_version`).
      example: csb2025_190000123456
    State:
      type: object
      required:
      - fips
      - name
      - postal
      - bbox
      properties:
        fips:
          $ref: '#/components/schemas/StateFips'
        name:
          type: string
          example: Iowa
        postal:
          type: string
          minLength: 2
          maxLength: 2
          example: IA
        bbox:
          $ref: '#/components/schemas/BBox'
    County:
      type: object
      required:
      - fips
      - name
      - state_fips
      - state_postal
      - bbox
      - centroid
      - has_field_coverage
      properties:
        fips:
          $ref: '#/components/schemas/CountyFips'
        name:
          type: string
          example: Polk
        state_fips:
          $ref: '#/components/schemas/StateFips'
        state_postal:
          type: string
          example: IA
        bbox:
          $ref: '#/components/schemas/BBox'
        centroid:
          $ref: '#/components/schemas/LatLon'
        has_field_coverage:
          type: boolean
          description: True when the county has CSB field polygons. Every county listed by
            `/geo/states/{state_fips}/counties` is in a supported state, so it is true there. A county fetched
            by fips outside the supported states is false; the UI should offer point-based analysis instead.
    Coverage:
      type: object
      required:
      - bounds
      - field_tiles
      - field_data_version
      - field_boundary_source
      - supported_states
      properties:
        bounds:
          allOf:
          - $ref: '#/components/schemas/BBox'
          description: Bounding box of the supported states (IA, IL, NE). Fit the initial map to it.
        supported_states:
          type: array
          description: Postal codes of the states with field polygons.
          items:
            type: string
            minLength: 2
            maxLength: 2
          example:
          - IA
          - IL
          - NE
        field_data_version:
          type: string
          example: csb2018-2025-ia-il-ne
        field_boundary_source:
          type: object
          required:
          - name
          - edition
          - boundary_type
          properties:
            name:
              type: string
              example: USDA Crop Sequence Boundaries
            edition:
              type: string
              description: Years covered by the CSB release.
              example: 2018-2025
            boundary_type:
              type: string
              enum:
              - estimated_csb
            attribution:
              type:
              - string
              - 'null'
        field_tiles:
          type: object
          description: |
            One PMTiles archive (https://github.com/protomaps/PMTiles), read by the frontend with HTTP Range
            requests. Source layer `fields`, one feature per CSB polygon, props: `field_id` (string, a `FieldId`),
            `crop_class` (string, latest mapped crop, may be empty), `area_ha` (number).
          required:
          - format
          - unit
          - min_zoom
          - max_zoom
          - url_template
          - regions
          properties:
            format:
              type: string
              enum:
              - pmtiles
            unit:
              type: string
              enum:
              - estimated_csb
              description: What the features in the `fields` layer are.
            min_zoom:
              type: integer
              description: Lowest zoom that has field polygons. No field is dropped at or above it.
              example: 12
            max_zoom:
              type: integer
              description: Highest zoom stored; the map overzooms beyond it.
              example: 14
            url_template:
              type: string
              description: Absolute URL of the `.pmtiles` file. By default the backend's own
                `/v1/tiles/fields.pmtiles`; may be external static hosting. Use it with the `pmtiles://`
                protocol; it is not an XYZ template.
              example: http://localhost:8000/v1/tiles/fields.pmtiles
            regions:
              type: array
              description: The supported states, one entry each.
              items:
                type: object
                required:
                - name
                - bbox
                properties:
                  name:
                    type: string
                    example: Iowa
                  bbox:
                    $ref: '#/components/schemas/BBox'
    SelectionSource:
      type: string
      description: How the user got here. Used for analytics and UI hints only; never changes results.
      enum:
      - landing_map_click
      - county_pick
      - location_link
      - coordinates
      - map_click
    SelectionRef:
      description: |
        What the client sends to identify "the field". Give a `field_id` when you have one (preferred),
        otherwise a `point`. Backend resolves it and returns the full `FieldSelection`.
      oneOf:
      - type: object
        required:
        - field_id
        additionalProperties: false
        properties:
          field_id:
            $ref: '#/components/schemas/FieldId'
      - type: object
        required:
        - point
        additionalProperties: false
        properties:
          point:
            $ref: '#/components/schemas/LatLon'
    FieldInfo:
      type: object
      required: [point, generated_at, cached, metrics]
      properties:
        point:
          $ref: '#/components/schemas/LatLon'
          description: Sampling coordinates, rounded to four decimal places.
        generated_at:
          type: string
          format: date-time
        cached:
          type: boolean
          description: True when every source result came from memory.
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
          description: |
            Always includes temperature_12m, precipitation_12m, solar_radiation_12m,
            temperature_normal, precipitation_normal, solar_radiation_normal,
            dominant_soil, soil_texture, soil_drainage, soil_organic_matter, soil_ph,
            elevation, slope, land_cover. Labels, units, source and notes are display-ready.
    FieldSelection:
      type: object
      description: Backend-resolved selection. This is the one object every page works with.
      required:
      - field_id
      - anchor
      - geometry
      - resolved_by
      - boundary_type
      - county
      - area_ha
      - source
      properties:
        field_id:
          type:
          - string
          - 'null'
          description: Null when `resolved_by = buffered_point`.
        anchor:
          allOf:
          - $ref: '#/components/schemas/LatLon'
          description: Point used to sample point datasets (polygon centroid, or the clicked point).
        geometry:
          description: The field polygon, or the buffered circle (approximated as a polygon) around the point.
          allOf:
          - $ref: '#/components/schemas/GeoJSONPolygon'
        bbox:
          $ref: '#/components/schemas/BBox'
        resolved_by:
          type: string
          enum:
          - field_polygon
          - snapped_point
          - buffered_point
          description: |
            `field_polygon`: id lookup or point inside a polygon.
            `snapped_point`: point snapped to nearest polygon within the snap radius.
            `buffered_point`: no polygon nearby, a circle of `buffer_m` is used.
        boundary_type:
          type: string
          enum:
          - estimated_csb
          - buffered_point
          description: |
            `estimated_csb`: a USDA Crop Sequence Boundaries polygon. It is an algorithmic estimate of a field
            from satellite crop maps, not a surveyed or ownership boundary: a real field may be split into
            several polygons or merged with a neighbour. The UI must say "estimated field area".
            `buffered_point`: no polygon here (outside the supported states, or nothing within the snap
            radius), a circle around the point is used.
            Enum is extensible.
        snap_distance_m:
          type:
          - number
          - 'null'
        buffer_m:
          type:
          - number
          - 'null'
        area_ha:
          type:
          - number
          - 'null'
        crop_class:
          type:
          - string
          - 'null'
          description: Latest mapped crop (USDA Cropland Data Layer class name, e.g. "Corn"). Null for buffered
            points or when the source has no crop for the latest year.
        crop_history:
          type: array
          description: Mapped crop per year from CSB, newest first, up to the CSB window length (8 years).
            Empty for buffered points. Years without a mapped crop are left out; never guessed.
          items:
            type: object
            required:
            - year
            - crop
            properties:
              year:
                type: integer
              crop:
                type: string
        county:
          type: object
          required:
          - fips
          - name
          - state_postal
          properties:
            fips:
              $ref: '#/components/schemas/CountyFips'
            name:
              type: string
            state_postal:
              type: string
        source:
          $ref: '#/components/schemas/SelectionSource'
      example:
        field_id: csb2025_190000123456
        anchor:
          lat: 41.5868
          lon: -93.625
        geometry:
          type: Polygon
          coordinates:
          - - - -93.634
              - 41.578
            - - -93.616
              - 41.578
            - - -93.616
              - 41.596
            - - -93.634
              - 41.596
            - - -93.634
              - 41.578
        resolved_by: field_polygon
        boundary_type: estimated_csb
        snap_distance_m: 0
        buffer_m: null
        area_ha: 32.4
        crop_class: Corn
        crop_history:
        - year: 2025
          crop: Corn
        - year: 2024
          crop: Soybeans
        - year: 2023
          crop: Corn
        county:
          fips: '19153'
          name: Polk
          state_postal: IA
        source: landing_map_click
    ResolvedLocation:
      type: object
      required:
      - input_kind
      - point
      - selection
      properties:
        input_kind:
          type: string
          enum:
          - plain_coordinates
          - google_maps_url
          - apple_maps_url
        point:
          allOf:
          - $ref: '#/components/schemas/LatLon'
          description: The point as parsed from the input, before snapping.
        selection:
          $ref: '#/components/schemas/FieldSelection'
    Metric:
      type: object
      required:
      - key
      - label
      - category
      - value
      - unit
      - quality
      - source
      - resolution_m
      properties:
        key:
          type: string
          description: |
            Stable machine key. Known keys (new ones may be added, the frontend must render unknown keys generically):
            `soil_moisture_surface` (SMAP), `soil_moisture_rootzone` (SMAP L4), `relative_humidity_2m` (NASA POWER),
            `air_temp_mean_2m`, `precip_30d_total`, `precip_annual_normal`, `soil_organic_matter_pct`,
            `soil_nitrogen_total` (estimated), `soil_ph`, `soil_texture_class`, `elevation_m`, `slope_pct`.
            `soil_wetness_surface` and `soil_wetness_rootzone` (NASA POWER, modeled, unit `fraction`).
            `soil_productivity_nccpi` (SSURGO, estimated, unit `index`, 0-100: USDA National Commodity Crop
            Productivity Index v3.0, area-weighted over the field area like the other SSURGO values).
          example: soil_moisture_surface
        label:
          type: string
          description: English display name.
          example: Soil moisture (surface)
        category:
          type: string
          enum:
          - moisture
          - atmosphere
          - temperature
          - precipitation
          - soil
          - terrain
          - vegetation
        value:
          type:
          - number
          - string
          - 'null'
          description: Number for continuous metrics, string for classes (e.g. texture), null if unavailable.
        unit:
          type: string
          description: 'Machine unit: `m3/m3`, `%`, `degC`, `mm`, `g/kg`, `m`, `pH`, `class`, `fraction` (0 to 1, e.g. NASA
            POWER modeled soil wetness), `none`.'
        as_of:
          type:
          - string
          - 'null'
          format: date
        period:
          type:
          - object
          - 'null'
          description: Averaging window for the value, if it is an aggregate.
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        quality:
          type: string
          enum:
          - measured
          - modeled
          - estimated
          - unavailable
          description: '`estimated` = derived proxy (e.g. nitrogen from organic matter). UI must label it as an estimate.'
        unavailable_reason:
          type:
          - string
          - 'null'
        source:
          type: object
          required:
          - dataset
          - provider
          properties:
            dataset:
              type: string
              example: SMAP L3 Enhanced Soil Moisture
            provider:
              type: string
              example: NASA
            url:
              type:
              - string
              - 'null'
              format: uri
        resolution_m:
          type:
          - number
          - 'null'
          description: Native spatial resolution in metres. Coarse values (greater than the field size) are shown with a warning.
        note:
          type:
          - string
          - 'null'
      example:
        key: soil_moisture_surface
        label: Soil moisture (surface)
        category: moisture
        value: 0.27
        unit: m3/m3
        as_of: '2026-11-12'
        period: null
        quality: measured
        unavailable_reason: null
        source:
          dataset: SMAP L3 Enhanced Soil Moisture
          provider: NASA
          url: null
        resolution_m: 9000
        note: null
    Snapshot:
      type: object
      required:
      - selection
      - generated_at
      - metrics
      - cached
      properties:
        selection:
          $ref: '#/components/schemas/FieldSelection'
        generated_at:
          type: string
          format: date-time
        cached:
          type: boolean
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
    Priority:
      type: string
      enum:
      - water_conservation
      - extra_income
      - soil_health
      - erosion_control
      - low_input_cost
      - nitrogen_fixing
    AnalysisRequest:
      type: object
      required:
      - selection
      properties:
        selection:
          $ref: '#/components/schemas/SelectionRef'
        options:
          type: object
          properties:
            priorities:
              type: array
              items:
                $ref: '#/components/schemas/Priority'
              maxItems: 6
              description: Farmer priorities. Empty means balanced.
            crop_history:
              type: array
              description: Optional farmer correction, newest first. When given it replaces the mapped
                `FieldSelection.crop_history`; the UI prefills it from that history and lets the farmer edit it.
              maxItems: 10
              items:
                type: object
                required:
                - year
                - crop
                properties:
                  year:
                    type: integer
                    minimum: 1990
                    maximum: 2100
                  crop:
                    type: string
            horizon_years:
              type: integer
              minimum: 1
              maximum: 5
              default: 3
              description: Number of future years evaluated by the rotation planner.
            budget:
              $ref: '#/components/schemas/RotationBudgetOptions'
            irrigated:
              type: [boolean, 'null']
              description: Farmer confirms whether the field is irrigated; null means unknown.
            has_livestock:
              type: [boolean, 'null']
              description: Farmer confirms a need for livestock forage; null means unknown.
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    AnalysisJob:
      type: object
      required:
      - job_id
      - status
      - created_at
      - progress
      properties:
        options:
          description: Original choices stored with this job. Use these instead of editable URL labels.
          allOf:
          - $ref: '#/components/schemas/AnalysisRequest/properties/options'
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        progress:
          type: object
          required:
          - percent
          - stage
          properties:
            percent:
              type: integer
              minimum: 0
              maximum: 100
            stage:
              type: string
              description: Human-readable current step, safe to show to the user.
              example: Fetching soil moisture history
        result:
          description: Present only when `status = succeeded`.
          allOf:
          - $ref: '#/components/schemas/AnalysisResult'
        error:
          description: Present only when `status = failed`.
          allOf:
          - $ref: '#/components/schemas/ApiError'
    AnalysisResult:
      type: object
      required:
      - selection
      - generated_at
      - model_version
      - strategies
      - current_conditions
      - datasets_used
      - disclaimer
      properties:
        selection:
          $ref: '#/components/schemas/FieldSelection'
        generated_at:
          type: string
          format: date-time
        model_version:
          type: string
          example: rotation-v0.1
        current_conditions:
          type: array
          description: Same metric shape as the snapshot, possibly with more metrics.
          items:
            $ref: '#/components/schemas/Metric'
        time_series:
          type: array
          description: Optional history for charts (e.g. soil moisture, precipitation).
          items:
            $ref: '#/components/schemas/TimeSeries'
        strategies:
          type: array
          description: Current rotation and available alternatives, with exactly one `is_current = true`.
            Sorted by `score` descending. Fewer alternatives may be returned when agronomic constraints
            rule out other crops; warnings explain missing alternatives.
          minItems: 1
          items:
            $ref: '#/components/schemas/Strategy'
        datasets_used:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRef'
        warnings:
          type: array
          items:
            type: string
          description: User-visible caveats (coarse data, missing history...).
        disclaimer:
          type: string
          description: Shown verbatim on the results page. The tool supports, not replaces, local expertise.
        ml_analysis:
          type: object
          additionalProperties: true
          description: Original ML /ml/v1/analyze response, preserved without rewriting its fields.
            Includes detected_rotation, summary, vulnerability_timeline, strategies, sources, warnings,
            and (in real mode) crop_suitability, score_notes and feature_source. Present for ML jobs;
            omitted for the explicit development stub. Income scores are relative indices, not money.
    TimeSeries:
      type: object
      required:
      - key
      - label
      - unit
      - points
      properties:
        key:
          type: string
          example: soil_moisture_surface
        label:
          type: string
        unit:
          type: string
        source:
          $ref: '#/components/schemas/DatasetRef'
        points:
          type: array
          items:
            type: object
            required:
            - t
            - v
            properties:
              t:
                type: string
                format: date
              v:
                type:
                - number
                - 'null'
    DatasetRef:
      type: object
      required:
      - dataset
      - provider
      properties:
        dataset:
          type: string
          example: NASA POWER
        provider:
          type: string
          example: NASA
        url:
          type:
          - string
          - 'null'
          format: uri
        resolution_m:
          type:
          - number
          - 'null'
        coverage_period:
          type:
          - string
          - 'null'
          example: 2015-2026
    Strategy:
      type: object
      required:
      - id
      - name
      - is_current
      - rotation
      - score
      - confidence
      - summary
      - benefits
      - risks
      - evidence
      - information_gaps
      - needs_local_review
      properties:
        id:
          type: string
          example: strat_corn_soy_cover
        name:
          type: string
          example: Corn / soybean with winter rye cover
        is_current:
          type: boolean
          description: True for the baseline (the farmer's existing rotation).
        rotation:
          type: array
          description: Ordered plantings. Explicit year and season preserve main and cover crops in the same year.
          items:
            type: object
            required:
            - season_index
            - crop
            - role
            properties:
              season_index:
                type: integer
                minimum: 0
                description: 0 = first season of the horizon.
              year:
                type: integer
                minimum: 1
                maximum: 5
                description: Planning year; omitted for older cycle-only results.
              season:
                type: string
                enum: [main, cover]
              crop:
                type: string
                example: Soybean
              role:
                type: string
                enum:
                - cash_crop
                - cover_crop
                - nitrogen_fixer
                - forage
                - fallow
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Fit to this field and the chosen priorities. Comparable only inside this result.
        score_breakdown:
          type: array
          items:
            type: object
            required:
            - criterion
            - score
            properties:
              criterion:
                type: string
                enum:
                - water_use
                - soil_health
                - erosion
                - nitrogen
                - pest_cycle
                - income
                - climate_risk
              score:
                type: number
                minimum: 0
                maximum: 100
        confidence:
          type: string
          enum:
          - low
          - medium
          - high
        summary:
          type: string
          description: One or two plain-language sentences for a farmer.
        benefits:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        evidence:
          type: array
          description: Why it was suggested, tied to data.
          items:
            type: object
            required:
            - statement
            properties:
              statement:
                type: string
              metric_key:
                type:
                - string
                - 'null'
              source:
                $ref: '#/components/schemas/DatasetRef'
        information_gaps:
          type: array
          items:
            type: string
        needs_local_review:
          type: boolean
          description: True when local agronomist or extension review is specifically advised.
        budget:
          $ref: '#/components/schemas/RotationBudget'
    BudgetAmounts:
      type: object
      required: [low, base, high]
      properties:
        low:
          type: number
        base:
          type: number
        high:
          type: number
    CropBudgetInput:
      type: object
      additionalProperties: false
      required: [crop, revenue_per_acre, production_cost_per_acre]
      properties:
        crop:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]*(\+[a-z][a-z0-9_]*)?$'
          description: ML crop slug, e.g. sorghum, oats, barley, alfalfa or fallow. For a specific
            double-crop budget, join both main slugs in growing order, e.g. winter_wheat+soybean.
        revenue_per_acre:
          type: object
          additionalProperties: false
          required: [low, base, high]
          description: Farmer's gross USD/acre revenue scenarios, in increasing order. Each must be nonnegative.
          properties:
            low: {type: number, minimum: 0, maximum: 100000}
            base: {type: number, minimum: 0, maximum: 100000}
            high: {type: number, minimum: 0, maximum: 100000}
        production_cost_per_acre:
          type: number
          minimum: 0
          maximum: 10000
          description: All non-land production costs; excludes cover crops. Replaces the crop baseline;
            no additional nitrogen credit is subtracted from this farmer total.
    RotationBudgetOptions:
      type: object
      additionalProperties: false
      properties:
        land_rent_per_acre:
          type: [number, 'null']
          minimum: 0
          maximum: 5000
          description: Annual USD/acre land cost, counted once per year. Zero means no land charge.
        cover_cost_per_acre:
          type: [number, 'null']
          minimum: 0
          maximum: 2000
          description: USD/acre for each cover planting, including seed, sowing and termination.
            Required for a complete budget when cover crops occur. Missing is unknown, never zero;
            program implementation schedules and survey direct costs are not silently used as all-in farm costs.
        crop_overrides:
          type: array
          maxItems: 16
          uniqueItems: true
          description: One entry per unique ML crop slug. Supplies missing crop budgets or replaces defaults.
          items:
            $ref: '#/components/schemas/CropBudgetInput'
    BudgetScenario:
      type: object
      required:
      - revenue_per_acre
      - cost_per_acre
      - profit_per_acre
      - field_profit
      properties:
        revenue_per_acre:
          type: number
        cost_per_acre:
          type: number
        profit_per_acre:
          type: number
          description: Negative means a loss.
        field_profit:
          type:
          - number
          - 'null'
          description: Field revenue minus field cost; null when area is unknown. Yearly amounts scale estimated acres. Horizon amounts sum yearly cents; annual amounts divide horizon totals.
        return_before_land_per_acre:
          type:
          - number
          - 'null'
          description: Revenue minus production and cover costs, before land cost. Not cash flow; published production
            budgets include labor, depreciation and ownership allowances.
        field_revenue:
          type:
          - number
          - 'null'
        field_cost:
          type:
          - number
          - 'null'
    BudgetScenarios:
      type: object
      required: [low, base, high]
      properties:
        low: {$ref: '#/components/schemas/BudgetScenario'}
        base: {$ref: '#/components/schemas/BudgetScenario'}
        high: {$ref: '#/components/schemas/BudgetScenario'}
    BudgetYear:
      type: object
      required:
      - year
      - main_crops
      - cover_crops
      - production_cost_per_acre
      - land_rent_per_acre
      - cover_cost_per_acre
      - nitrogen_credit_per_acre
      - yield_per_acre
      - yield_unit
      - scenarios
      properties:
        year:
          type: integer
          minimum: 1
        main_crops:
          type: array
          items:
            type: string
        cover_crops:
          type: array
          items:
            type: string
        production_cost_per_acre:
          type:
          - number
          - 'null'
        land_rent_per_acre:
          type:
          - number
          - 'null'
        cover_cost_per_acre:
          type:
          - number
          - 'null'
        nitrogen_credit_per_acre:
          type: number
        yield_per_acre:
          type:
          - number
          - 'null'
          description: Yield matched to the extension cost profile, not an ML prediction; null for a farmer-supplied
            gross revenue budget.
        yield_unit:
          type:
          - string
          - 'null'
        cost_profile:
          type:
          - string
          - 'null'
          description: Published enterprise budget and reference yield used for this year.
        break_even_price_per_unit:
          type:
          - number
          - 'null'
          description: Total modeled cost, including land and cover costs, divided by reference yield.
        scenarios:
          oneOf:
          - $ref: '#/components/schemas/BudgetScenarios'
          - type: 'null'
        yield_source:
          type: string
          enum:
          - budget_reference
          - baseline_default
          - farmer
          - unavailable
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRef'
    RotationBudget:
      type: object
      required:
      - status
      - currency
      - horizon_years
      - area_acres
      - years
      - annual_average
      - horizon_total
      - delta_vs_current_per_acre
      - is_illustrative
      - uses_placeholders
      - baseline_version
      - assumptions
      - missing_inputs
      - sources
      properties:
        status:
          type: string
          enum:
          - estimated
          - partial
          - unavailable
        currency:
          type: string
          enum:
          - USD
        horizon_years:
          type: integer
          minimum: 1
        area_acres:
          type:
          - number
          - 'null'
        years:
          type: array
          items:
            $ref: '#/components/schemas/BudgetYear'
        annual_average:
          description: Average annual USD/acre figures, including one land charge per year. Null unless all years
            are budgeted.
          oneOf:
          - $ref: '#/components/schemas/BudgetScenarios'
          - type: 'null'
        horizon_total:
          description: Undiscounted USD/acre totals over the full horizon. Field amounts sum yearly cents. No inflation or price forecast.
          oneOf:
          - $ref: '#/components/schemas/BudgetScenarios'
          - type: 'null'
        delta_vs_current_per_acre:
          description: Difference in average annual profit against the current rotation under matching low/base/high
            scenarios. Null unless both budgets cover every year over the same horizon. These are paired scenarios,
            not confidence interval bounds; the differences need not be increasing.
          oneOf:
          - $ref: '#/components/schemas/BudgetAmounts'
          - type: 'null'
        is_illustrative:
          type: boolean
          const: true
        uses_placeholders:
          type: boolean
          description: A required baseline is marked placeholder. Its numbers are withheld, so complete totals
            remain null.
        baseline_version:
          type: string
        assumptions:
          type: array
          items:
            type: string
        missing_inputs:
          type: array
          items:
            type: string
          description: Missing crop/rent/double-crop budgets. Missing amounts are never treated as zero.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRef'
    ProfitCrop:
      type: string
      description: Crops with baseline data. Names match the CDL class names in `crop_class` / `crop_history`.
      enum:
      - Corn
      - Soybeans
      - Winter Wheat
    ProfitState:
      type: string
      description: State postal code. Only the three supported states have baseline data.
      enum:
      - IA
      - IL
      - NE
    ProfitPriceInput:
      type: object
      additionalProperties: false
      required:
      - low
      - base
      - high
      description: Farmer sale-price scenarios in USD/bu. Must satisfy low <= base <= high. Zero is valid.
      properties:
        low:
          type: number
          minimum: 0
          maximum: 1000
        base:
          type: number
          minimum: 0
          maximum: 1000
        high:
          type: number
          minimum: 0
          maximum: 1000
    CostOverrides:
      type: object
      additionalProperties: false
      description: Farmer costs in USD/acre. Total replaces every cost including land; detail lines cannot accompany
        total.
      properties:
        seed:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 10000
        fertilizer:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 10000
        chemicals:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 10000
        other_operating:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 10000
        land_rent_per_acre:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 5000
          description: Annual land cost. Explicit zero means no land charge.
        total_cost_per_acre:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 10000
          description: All costs including land. Takes precedence over land_rent_per_acre.
    ProfitEstimateRequest:
      type: object
      additionalProperties: false
      required:
      - crop
      - state
      properties:
        crop:
          $ref: '#/components/schemas/ProfitCrop'
        state:
          $ref: '#/components/schemas/ProfitState'
        predicted_yield:
          type:
          - number
          - 'null'
          maximum: 1000
          description: Optional separately modeled yield in bu/acre. No ML score is converted to yield. Cannot
            accompany yield_per_acre.
          minimum: 0
        previous_crop:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Last season's crop (e.g. newest `crop_history` entry). "Soybeans" before Corn selects the
            published corn-after-soybeans cost/yield profile. Illinois soybeans after soybeans select their own
            profile. Published rotation effects receive no extra nitrogen discount.
        cost_overrides:
          $ref: '#/components/schemas/CostOverrides'
        yield_per_acre:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1000
          description: Farmer yield assumption in bu/acre, including zero for crop failure. Cannot accompany predicted_yield.
        price_overrides:
          oneOf:
          - $ref: '#/components/schemas/ProfitPriceInput'
          - type: 'null'
        area_ha:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 1000000
          description: Estimated farmed area in hectares; omitted means field totals are unknown.
      example:
        crop: Corn
        state: IA
        predicted_yield: 205
        previous_crop: Soybeans
        cost_overrides:
          land_rent_per_acre: 250
    ProfitScenario:
      type: object
      required:
      - price
      - revenue_per_acre
      - cost_per_acre
      - profit_per_acre
      properties:
        price:
          type: number
          description: $ per yield unit.
        revenue_per_acre:
          type: number
        cost_per_acre:
          type: number
        profit_per_acre:
          type: number
          description: Negative means a loss.
        return_before_land_per_acre:
          type:
          - number
          - 'null'
          description: Revenue minus non-land costs. Null when farmer total does not identify land cost.
        break_even_yield_per_acre:
          type:
          - number
          - 'null'
          description: Total cost divided by sale price. Null at zero price or when the ratio cannot fit a finite JSON number.
        field_revenue:
          type:
          - number
          - 'null'
        field_cost:
          type:
          - number
          - 'null'
        field_profit:
          type:
          - number
          - 'null'
    ProfitCostItem:
      type: object
      required:
      - key
      - label
      - amount_per_acre
      - source
      properties:
        key:
          type: string
          enum:
          - seed
          - fertilizer
          - chemicals
          - other_operating
          - land_rent
          - total
        label:
          type: string
        amount_per_acre:
          type: number
        source:
          type: string
          enum:
          - baseline
          - farmer
          - baseline_with_nitrogen_credit
          - baseline_rotation
    ProfitEstimate:
      type: object
      required:
      - crop
      - state
      - yield_per_acre
      - yield_unit
      - yield_source
      - costs
      - scenarios
      - assumptions
      - baseline
      - status
      - missing_inputs
      - sources
      properties:
        crop:
          $ref: '#/components/schemas/ProfitCrop'
        state:
          $ref: '#/components/schemas/ProfitState'
        yield_per_acre:
          type:
          - number
          - 'null'
        yield_unit:
          type: string
          example: bu
        yield_source:
          type: string
          enum:
          - model
          - baseline_default
          - budget_reference
          - farmer
          - unavailable
        cost_profile:
          type:
          - string
          - 'null'
          description: Published production-cost profile. Its own reference yield is used by default; with a farmer
            total cost, the independent state-average yield remains the fallback.
        costs:
          type: array
          description: Cost lines that add up to `scenarios.*.cost_per_acre`. One `total` line when the farmer
            gave `total_cost_per_acre`.
          items:
            $ref: '#/components/schemas/ProfitCostItem'
        scenarios:
          description: Null unless every required input is sourced or supplied by the farmer.
          oneOf:
          - type: object
            description: Same yield and costs; only the price differs.
            required:
            - low
            - base
            - high
            properties:
              low:
                $ref: '#/components/schemas/ProfitScenario'
              base:
                $ref: '#/components/schemas/ProfitScenario'
              high:
                $ref: '#/components/schemas/ProfitScenario'
          - type: 'null'
        assumptions:
          type: array
          description: Plain-English lines showing how each number was calculated, e.g. "Revenue = 205 bu × $4.30
            = $881.50". Display as-is.
          items:
            type: string
        baseline:
          type: object
          required:
          - version
          - is_placeholder
          properties:
            version:
              type: string
            is_placeholder:
              type: boolean
              description: True when a required baseline input is unavailable or marked placeholder. Placeholder
                numbers are never calculated.
        status:
          type: string
          enum:
          - estimated
          - unavailable
        currency:
          type: string
          const: USD
        is_illustrative:
          type: boolean
          const: true
        area_acres:
          type:
          - number
          - 'null'
        break_even_price_per_unit:
          type:
          - number
          - 'null'
          description: All modeled costs divided by yield. Null at zero/unavailable yield or when the ratio cannot fit a finite JSON number.
        price_source:
          type: string
          enum:
          - baseline
          - farmer
          - unavailable
        missing_inputs:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRef'
    RotationBudgetSeason:
      type: object
      additionalProperties: false
      required:
      - year
      - season
      - crop
      properties:
        year:
          type: integer
          minimum: 1
          maximum: 5
        season:
          type: string
          enum:
          - main
          - cover
        crop:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
    RotationBudgetRequest:
      type: object
      additionalProperties: false
      required:
      - sequence
      - state
      properties:
        horizon_years:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: Optional intended horizon. Cannot precede any sequence year; trailing missing years remain incomplete.
        sequence:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/RotationBudgetSeason'
          description: Chronological crop plan. No duplicate year/season/crop entries; at most two harvested crops
            per year. Missing years stay incomplete.
        state:
          type: string
          pattern: ^[A-Z]{2}$
          description: US state postal code. States without baselines require farmer crop and land inputs.
        area_ha:
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
          maximum: 1000000
        previous_crop:
          type:
          - string
          - 'null'
          maxLength: 100
        options:
          $ref: '#/components/schemas/RotationBudgetOptions'
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - NOT_FOUND
      - UNPARSEABLE_INPUT
      - UNSUPPORTED_LINK
      - OUTSIDE_COVERAGE
      - UPSTREAM_DATA_UNAVAILABLE
      - RATE_LIMITED
      - INTERNAL_ERROR
      - UNAUTHORIZED
      - EMAIL_TAKEN
      - FIELD_LIMIT_REACHED
      - ANALYSIS_NOT_READY
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Safe to show to the user.
        details:
          type: object
          additionalProperties: true
          description: 'Optional machine details, e.g. `{ "field": "input" }`.'
        request_id:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    CountyRef:
      type: object
      required: [fips, name, state_postal]
      properties:
        fips:
          $ref: '#/components/schemas/CountyFips'
        name:
          type: string
        state_postal:
          type: string
    CropHistorySummary:
      type: object
      description: Past crops as a renter reads them. Counts cover the years on record.
      required: [source, years_recorded, first_year, latest_year, latest_crop, corn_years, soybean_years,
        other_years, distinct_crops, corn_in_a_row, pattern]
      properties:
        source:
          type: string
          enum: [farmer, usda_csb, none]
          description: '`farmer`: the saved field''s own crop history; `usda_csb`: mapped crops; `none`: no years.'
        years_recorded: {type: integer, minimum: 0}
        first_year: {type: [integer, 'null']}
        latest_year: {type: [integer, 'null']}
        latest_crop: {type: [string, 'null']}
        corn_years: {type: integer, minimum: 0}
        soybean_years: {type: integer, minimum: 0}
        other_years: {type: integer, minimum: 0, description: Every other crop, including double crops.}
        distinct_crops: {type: integer, minimum: 0}
        corn_in_a_row:
          type: integer
          minimum: 0
          description: Consecutive corn years ending at the latest year (0 when the latest crop is not corn).
        pattern:
          type: string
          enum: [corn_soybean, continuous_corn, continuous_soybean, mixed, unknown]
          description: From the latest 4 years. `continuous_*` also when the same crop runs 3 or more years up
            to the latest year. `unknown` with fewer than 2 years.
    ComparisonPlan:
      type: object
      additionalProperties: false
      description: One crop plan budgeted on every field, so the money rows compare like with like.
      properties:
        rotation:
          type: array
          minItems: 1
          maxItems: 3
          default: [corn, soybean]
          items:
            type: string
            enum: [corn, soybean, winter_wheat]
          description: Crops in order, repeated over the horizon. Each field starts with the crop after its
            latest crop (after corn, a corn/soybean plan starts with soybeans).
        horizon_years:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
    SavedFieldComparisonRequest:
      type: object
      additionalProperties: false
      required:
      - saved_field_ids
      properties:
        saved_field_ids:
          type: array
          minItems: 2
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: The user's saved field ids. Columns come back in this order, labelled A to D.
        rent_per_acre:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 5000
          description: Annual asking rent in USD/acre keyed by saved field UUID. Omitted fields use the sourced
            state reference; zero means no land charge.
        plan:
          $ref: '#/components/schemas/ComparisonPlan'
        crop_overrides:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/CropBudgetInput'
          description: The farmer's own revenue and non-land cost per crop, applied to every field.
        home:
          $ref: '#/components/schemas/LatLon'
          description: The farmstead. Adds a `distance_from_home` row (straight line, km).
    RentUsed:
      type: object
      required: [per_acre, source, is_placeholder]
      properties:
        per_acre: {type: [number, 'null'], description: USD/acre/year. Null when the state has no reference.}
        source: {type: string, enum: [farmer, state_baseline, none]}
        is_placeholder: {type: boolean, description: The state reference is an unsourced placeholder.}
    ComparedField:
      type: object
      description: One column of the comparison.
      required: [saved_field_id, label, name, field_id, state, county, anchor, boundary_type, area_ha, rent,
        budget, net_return_per_acre, net_return_field, break_even_rent_per_acre, history, strengths, cautions,
        data_as_of, info_as_of]
      properties:
        saved_field_id: {type: string, format: uuid}
        label: {type: string, enum: [A, B, C, D], description: Column letter in request order. Use it on the map.}
        name: {type: string}
        field_id: {type: [string, 'null']}
        state: {type: string}
        county:
          oneOf:
          - $ref: '#/components/schemas/CountyRef'
          - type: 'null'
        anchor:
          $ref: '#/components/schemas/LatLon'
          description: The saved centroid.
        boundary_type:
          type: string
          enum: [estimated_csb, buffered_point]
          description: '`buffered_point`: no mapped field; soil is read around a point.'
        area_ha: {type: [number, 'null'], description: Null for a field saved as a point.}
        rent:
          $ref: '#/components/schemas/RentUsed'
        budget:
          description: The plan's budget at `rent`. Null only when the state has no rent reference.
          oneOf:
          - $ref: '#/components/schemas/RotationBudget'
          - type: 'null'
        net_return_per_acre:
          description: Average return after all costs and rent, USD/acre/year, at low/base/high prices.
            Null unless every plan year is budgeted.
          oneOf:
          - $ref: '#/components/schemas/BudgetAmounts'
          - type: 'null'
        net_return_field:
          description: '`net_return_per_acre` times the field''s acres, USD/year. Null without an area.'
          oneOf:
          - $ref: '#/components/schemas/BudgetAmounts'
          - type: 'null'
        break_even_rent_per_acre:
          description: Return before land, USD/acre/year. The highest rent the field carries without a loss.
          oneOf:
          - $ref: '#/components/schemas/BudgetAmounts'
          - type: 'null'
        history:
          $ref: '#/components/schemas/CropHistorySummary'
        strengths:
          type: array
          items: {type: string}
          description: Plain-English points in this field's favour. Safe to show as is.
        cautions:
          type: array
          items: {type: string}
          description: Plain-English things to check (losses at this rent, corn after corn, slope, missing data).
        data_as_of:
          type: [string, 'null']
          format: date-time
          description: When the soil snapshot was made. Null when it could not be loaded.
        info_as_of:
          type: [string, 'null']
          format: date-time
          description: When the saved field context was fetched.
    ValueRange:
      type: object
      required: [min, max]
      properties:
        min: {type: number}
        max: {type: number}
    ComparisonCell:
      type: object
      required: [saved_field_id, value, quality]
      properties:
        saved_field_id: {type: string, format: uuid}
        value:
          type: [number, string, 'null']
          description: In the row's `unit` (metric units for soil, land and climate; USD for money).
        quality:
          type: string
          enum: [measured, modeled, estimated, unavailable]
        note:
          type: [string, 'null']
          description: How the value was obtained, or why it is unavailable.
    ComparisonRow:
      type: object
      required: [key, label, group, unit, better, cells, best, same_for_all]
      properties:
        key:
          type: string
          description: |
            Stable key. 0.12.0 rows, in this order: money `net_return_per_acre`, `net_return_field`,
            `break_even_rent`, `rent`, `rent_per_productivity_point`; land `area` (ha), `slope`, `land_cover`,
            `distance_from_home` (only with `home`); soil `soil_productivity_nccpi`, `soil_organic_matter_pct`,
            `soil_ph`, `soil_texture_class`, `soil_drainage`; history `rotation_pattern`, `latest_crop`,
            `corn_in_a_row`; climate `precipitation_normal`, `temperature_normal`. Render unknown keys generically.
        label: {type: string}
        group: {type: string, enum: [money, land, soil, history, climate]}
        unit: {type: string, description: 'Same unit codes as `Metric.unit`, plus `USD/acre/year`, `USD/year`, `USD/acre/point`, `years`.'}
        better:
          type: string
          enum: [higher, lower, target, none]
          description: '`target`: closest to `target` wins. `none`: no ranking (texture, size, climate).'
        target:
          oneOf:
          - $ref: '#/components/schemas/ValueRange'
          - type: 'null'
        cells:
          type: array
          items: {$ref: '#/components/schemas/ComparisonCell'}
          description: One per field, in `fields` order.
        best:
          type: array
          items: {type: string, format: uuid}
          description: Fields with the best value (ties allowed). Empty when fewer than two values compare,
            when every value ties, or when `better` is `none`.
        same_for_all:
          type: boolean
          description: Every field has the same value. The row does not tell the fields apart; the UI may fold it.
        note: {type: [string, 'null']}
    ComparisonBest:
      type: object
      required: [net_return, soil_productivity, rent_value]
      description: Shortcuts to the `best` of the three headline rows.
      properties:
        net_return:
          type: array
          items: {type: string, format: uuid}
        soil_productivity:
          type: array
          items: {type: string, format: uuid}
        rent_value:
          type: array
          items: {type: string, format: uuid}
    FieldComparison:
      type: object
      required: [generated_at, plan, fields, rows, best, warnings, disclaimer]
      properties:
        generated_at: {type: string, format: date-time}
        plan:
          $ref: '#/components/schemas/ComparisonPlan'
        fields:
          type: array
          minItems: 2
          maxItems: 4
          items: {$ref: '#/components/schemas/ComparedField'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/ComparisonRow'}
        best:
          $ref: '#/components/schemas/ComparisonBest'
        warnings:
          type: array
          items: {type: string}
          description: Show above the table. Always says money rows are illustrative state budgets.
        disclaimer: {type: string}
    AreaRankingRequest:
      type: object
      additionalProperties: false
      required: [area]
      properties:
        area:
          oneOf:
          - type: object
            additionalProperties: false
            required: [county_fips]
            properties:
              county_fips:
                $ref: '#/components/schemas/CountyFips'
          - type: object
            additionalProperties: false
            required: [bbox]
            properties:
              bbox:
                $ref: '#/components/schemas/BBox'
          - type: object
            additionalProperties: false
            required: [polygon]
            properties:
              polygon:
                $ref: '#/components/schemas/GeoJSONPolygon'
        filters:
          type: object
          additionalProperties: false
          properties:
            min_area_ha: {type: [number, 'null'], minimum: 0}
            max_area_ha: {type: [number, 'null'], minimum: 0}
            min_productivity: {type: [number, 'null'], minimum: 0, maximum: 100}
            latest_crops:
              type: array
              maxItems: 10
              items: {type: string}
              description: Keep fields whose latest mapped crop is one of these CDL names (case-insensitive).
            exclude_continuous_corn:
              type: boolean
              default: false
              description: Drop fields with corn 3 or more years in a row up to the latest year.
        sort:
          type: string
          enum: [productivity, area, distance]
          default: productivity
          description: '`productivity` and `area` descending, `distance` ascending (needs `near`).'
        near:
          $ref: '#/components/schemas/LatLon'
          description: 'Adds `distance_km` to every field; required for `sort: distance`.'
        pinned_field_ids:
          type: array
          maxItems: 4
          items: {type: string, minLength: 1, maxLength: 64}
          description: CSB field ids to report in `pinned` whatever the page, e.g. the fields being compared.
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
        offset: {type: integer, minimum: 0, maximum: 50000, default: 0}
    Quartiles:
      type: object
      required: [p25, median, p75]
      properties:
        p25: {type: number}
        median: {type: number}
        p75: {type: number}
    RankedField:
      type: object
      required: [field_id, rank, matches_filters, anchor, bbox, county_fips, area_ha, history, productivity,
        soil_name, drainage, distance_km, area_percentile, productivity_percentile]
      properties:
        field_id: {type: string}
        rank: {type: [integer, 'null'], minimum: 1, description: 'Position among matching fields; null for a pinned field that fails the filters.'}
        matches_filters: {type: boolean}
        anchor:
          $ref: '#/components/schemas/LatLon'
          description: A point inside the field (where its soil is read).
        bbox:
          $ref: '#/components/schemas/BBox'
        county_fips: {type: string}
        area_ha: {type: number}
        history:
          $ref: '#/components/schemas/CropHistorySummary'
        productivity: {type: [number, 'null'], minimum: 0, maximum: 100, description: NCCPI 0-100 at the field's point.}
        soil_name: {type: [string, 'null'], description: Dominant soil component at the point.}
        drainage: {type: [string, 'null'], description: Drainage class of that component.}
        distance_km: {type: [number, 'null'], description: Straight line from `near`; null without it.}
        area_percentile:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Share of the other matching fields that are smaller (0-100). Null with fewer than 2.
        productivity_percentile:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Share of the other rated matching fields with a lower rating. Null when unrated.
    AreaRanking:
      type: object
      required: [area, total, sort, offset, limit, next_offset, soil, stats, items, pinned, notes]
      properties:
        area:
          type: object
          required: [kind, county, bbox]
          properties:
            kind: {type: string, enum: [county, bbox, polygon]}
            county:
              oneOf:
              - $ref: '#/components/schemas/CountyRef'
              - type: 'null'
            bbox:
              $ref: '#/components/schemas/BBox'
        total: {type: integer, minimum: 0, description: Fields matching the filters.}
        sort: {type: string, enum: [productivity, area, distance]}
        offset: {type: integer}
        limit: {type: integer}
        next_offset: {type: [integer, 'null'], description: Offset of the next page; null on the last page.}
        soil:
          type: object
          required: [status, fields_rated, fields_total, method]
          properties:
            status:
              type: string
              enum: [complete, partial, filling, unavailable]
              description: '`filling`: lookups running, ask again in a few seconds. `partial` / `unavailable`:
                lookups failed for some / all fields.'
            fields_rated: {type: integer, minimum: 0}
            fields_total: {type: integer, minimum: 0, description: All fields of the area, before filters.}
            method: {type: string}
        stats:
          type: object
          required: [area_ha, productivity]
          description: Quartiles over the matching fields (rated ones for productivity).
          properties:
            area_ha:
              oneOf:
              - $ref: '#/components/schemas/Quartiles'
              - type: 'null'
            productivity:
              oneOf:
              - $ref: '#/components/schemas/Quartiles'
              - type: 'null'
        items:
          type: array
          items: {$ref: '#/components/schemas/RankedField'}
        pinned:
          type: array
          items: {$ref: '#/components/schemas/RankedField'}
          description: The requested `pinned_field_ids` found in the area, in request order.
        notes:
          type: array
          items: {type: string}
