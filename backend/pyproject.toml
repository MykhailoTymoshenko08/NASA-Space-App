[project]
name = "field-shift-backend"
version = "0.1.0"
description = "Field Shift MVP backend (NASA Space Apps crop-rotation decision support)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cachetools>=8.0.0",
    "diskcache>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.162.7",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pmtiles>=3.8.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["contract: validates real responses against contract/openapi.yaml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[dependency-groups]
dev = [
    "openapi-core>=0.23.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
