# PostGIS for the CSB field polygons, and the API.
#   make db   PostGIS only (for `make dev`, tests and the data import), host port 5433
#   make up   PostGIS + API on http://localhost:8000
services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://fieldshift:fieldshift@db:5432/fieldshift
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Field Shift}
      ANALYSIS_ENGINE: ${ANALYSIS_ENGINE:-ml}
      # Override the host's localhost URL: containers reach ML by its Compose service name.
      ML_BASE_URL: http://ml:8001
      ML_TIMEOUT_S: ${ML_TIMEOUT_S:-30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Field PMTiles (Git LFS, ~540 MB): mounted read-only, not baked into the image.
      - ./data/csb_ia_il_ne.pmtiles:/app/data/csb_ia_il_ne.pmtiles:ro
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy

  ml:
    build: ../ml
    image: fieldshift-ml:0.2.0
    environment:
      PORT: 8001
      ML_MODE: ${ML_MODE:-real}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ml_ssurgo_cache:/app/data/features/ssurgo_cache
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: fieldshift
      POSTGRES_PASSWORD: fieldshift
      POSTGRES_DB: fieldshift
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bulk import of ~3 million polygons: more memory for index builds and fewer checkpoints.
    command: >
      postgres -c maintenance_work_mem=1GB -c max_wal_size=8GB -c shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldshift -d fieldshift"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  ml_ssurgo_cache:
