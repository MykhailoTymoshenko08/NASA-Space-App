name: backend

on:
  push:
    paths: ["backend/**", "ml/**", "contract/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "ml/**", "contract/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Tests create a scratch database here (TEST_DATABASE_ADMIN_URL in tests/conftest.py).
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: fieldshift
          POSTGRES_PASSWORD: fieldshift
          POSTGRES_DB: fieldshift
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fieldshift" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app scripts tests
      # Contract drift (responses vs contract/openapi.yaml, stale openapi.json) fails the build.
      - run: make contract-check
      - run: make test
